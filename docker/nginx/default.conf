server {
    listen 80;
    server_name _;
    # Path inside the nginx container: PHP-FPM (service `app`) owns the
    # actual code, so SCRIPT_FILENAME is hardcoded to where PHP-FPM sees it.
    root /var/www/public;
    index index.php;

    # Laravel accepts avatars up to 10 MB and attachments up to 20 MB;
    # PHP allows 25 MB so validation runs first. Leave room for multipart
    # overhead (28 MB) so nginx never rejects before Laravel can respond.
    client_max_body_size 28m;

    # Resolve the PHP-FPM container at request time. Docker's embedded DNS
    # is not always populated when nginx first starts, which otherwise
    # causes "host not found in upstream app" and a crash loop.
    resolver 127.0.0.11 valid=10s;

    # NOTE: nginx only holds static assets (the `assets` volume) — no
    # index.php. The last try_files argument is an internal redirect and
    # does not need to exist here; it re-matches the PHP location below.
    # $uri/ is intentionally omitted: without index.php on disk it would
    # resolve "/" to a directory and return 403 Forbidden.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Built Vite assets live in this container via the shared `assets`
    # volume, so nginx serves them directly without touching PHP.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
