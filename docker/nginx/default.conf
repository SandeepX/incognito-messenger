server {
    listen 80;
    server_name _;
    # Path inside the nginx container: PHP-FPM (service `app`) owns the
    # actual code, so SCRIPT_FILENAME is hardcoded to where PHP-FPM sees it.
    root /var/www/public;
    index index.php;

    # Laravel accepts avatars up to 10 MB and 5 attachments of 20 MB each.
    # PHP allows 25 MB per file; this request cap leaves room for the whole
    # batch plus multipart overhead so Laravel can validate every file first.
    client_max_body_size 110m;

    # Resolve the PHP-FPM container at request time. Docker's embedded DNS
    # is not always populated when nginx first starts, which otherwise
    # causes "host not found in upstream app" and a crash loop.
    resolver 127.0.0.11 valid=10s;

    # Reverb WebSocket (/app) and HTTP API (/apps) on the SAME origin as the
    # Laravel app. Echo derives its host/port from window.location, so plain
    # HTTP on localhost:8000 must proxy these paths to Reverb just like the
    # Caddy HTTPS origin does. Resolve the container at request time so a
    # slow-starting Reverb does not crash nginx at boot.
    location ~ ^/(app|apps)(/|$) {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # NOTE: nginx only holds static assets (the `assets` volume) — no
    # index.php. The last try_files argument is an internal redirect and
    # does not need to exist here; it re-matches the PHP location below.
    # $uri/ is intentionally omitted: without index.php on disk it would
    # resolve "/" to a directory and return 403 Forbidden.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Avatars are images by extension, but they are private files served by
    # Laravel from MinIO. This prefix MUST win over the static-image rule below.
    location ^~ /avatars/ {
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    # Built Vite assets live in this container via the shared `assets`
    # volume, so nginx serves them directly without touching PHP.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
