; Laravel caps avatars at 10 MB (AvatarUpload) and attachments at 20 MB each
; (AttachmentUpload), with up to 5 attachments per message. upload_max_filesize
; stays just above a single file; post_max_size must fit the whole batch so
; Laravel can return friendly validation errors instead of PHP's generic
; "failed to upload" message.
upload_max_filesize = 25M
post_max_size = 110M
memory_limit = 256M
