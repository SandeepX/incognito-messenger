name: incognito-messenger

services:
  minio:
    build:
      context: ./docker/minio
    image: incognito-minio:local
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - messenger

  minio-init:
    build:
      context: ./docker/minio
    image: incognito-minio:local
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - messenger

  migrate:
    image: incognito-messenger-app
    entrypoint: ["sh", "-c", "php artisan migrate --force --seed --no-interaction"]
    restart: "no"
    env_file: .env
    environment:
      REVERB_HOST: reverb
      DB_DATABASE: /var/www/storage/db/database.sqlite
      CACHE_STORE: file
    volumes:
      - db-data:/var/www/storage/db
    networks:
      - messenger

  assets:
    image: incognito-messenger-app
    entrypoint: ["sh", "-c", "rm -rf /out/* && cp -a /var/www/public/. /out/"]
    restart: "no"
    volumes:
      - assets:/out
    networks:
      - messenger

  app:
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    image: incognito-messenger-app
    env_file: .env
    environment:
      REVERB_HOST: reverb
      APP_URL: ${APP_URL}
      CACHE_STORE: file
      DB_DATABASE: /var/www/storage/db/database.sqlite
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - db-data:/var/www/storage/db
    networks:
      - messenger

  webserver:
    image: nginx:alpine
    depends_on:
      assets:
        condition: service_completed_successfully
      app:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - assets:/var/www/public:ro
    networks:
      - messenger

  reverb:
    image: incognito-messenger-app
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    env_file: .env
    environment:
      REVERB_HOST: reverb
      DB_DATABASE: /var/www/storage/db/database.sqlite
      CACHE_STORE: file
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - db-data:/var/www/storage/db
    networks:
      - messenger

networks:
  messenger:

volumes:
  db-data:
  assets:
  minio-data:
