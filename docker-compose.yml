services:
  # ---------------- One-shot: create schema + seed users ----------------
  # app, reverb and webserver wait for this to exit successfully, so
  # Reverb never races the first migration (SQLite file + tables).
  migrate:
    image: websocket-demo-app
    entrypoint: ["sh", "-c", "php artisan migrate --force --seed --no-interaction"]
    restart: "no"
    env_file: .env
    environment:
      REVERB_HOST: reverb
      DB_DATABASE: /var/www/storage/db/database.sqlite
    volumes:
      - db-data:/var/www/storage/db
    networks:
      - websocket-demo

  # ---------------- One-shot: copy built frontend assets ----------------
  # nginx has no application code baked in, so a one-shot service copies
  # the built JS/CSS from the app image into a shared volume nginx mounts.
  assets:
    image: websocket-demo-app
    entrypoint: ["sh", "-c", "rm -rf /out/* && cp -a /var/www/public/. /out/"]
    restart: "no"
    volumes:
      - assets:/out
    networks:
      - websocket-demo

  # ---------------- PHP-FPM: Laravel application ----------------
  app:
    build:
      context: .
      args:
        # Baked into the JS bundle: the BROWSER connects to ws://<page-host>:8080
        # (the port we expose from the `reverb` container). The WS host comes
        # from window.location.hostname at runtime, so LAN access needs no
        # special handling. Compose interpolates the key from .env automatically.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_PORT: 8080
    image: websocket-demo-app
    env_file: .env
    environment:
      # Server-to-server traffic (Laravel → Reverb) must use the Docker
      # service name, NOT localhost: inside the network, localhost is the
      # container itself. This is the single most common Docker mistake
      # with Reverb (it causes "cURL error 7 ... Failed to connect").
      REVERB_HOST: reverb
      APP_URL: http://localhost:8000
      # The sqlite DB lives in storage/db (a directory volume works;
      # a file-path volume mount does not). env var overrides .env.
      DB_DATABASE: /var/www/storage/db/database.sqlite
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Only the sqlite file lives here — migrations/ stays untouched in
      # the image, so code changes are never shadowed by the volume.
      - db-data:/var/www/storage/db
    networks:
      - websocket-demo

  # ---------------- Nginx: serves the PHP app on port 8000 ----------------
  webserver:
    image: nginx:alpine
    depends_on:
      assets:
        condition: service_completed_successfully
      app:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - assets:/var/www/public:ro
    networks:
      - websocket-demo

  # ---------------- Reverb: the actual WebSocket server ----------------
  # Same image as `app`, different process. It only listens for
  # WebSocket connections; all its config (id/key/secret) comes from
  # env_file .env.
  reverb:
    image: websocket-demo-app
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    env_file: .env
    environment:
      REVERB_HOST: reverb
      DB_DATABASE: /var/www/storage/db/database.sqlite
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Exposed so browsers on your machine can open ws://localhost:8080
      - "8080:8080"
    networks:
      - websocket-demo

networks:
  websocket-demo:

volumes:
  db-data:
  assets:
